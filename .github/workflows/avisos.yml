# Avisos diarios de la app de entrenamiento de Laura y Juan David.
# Hora de Colombia = UTC - 5. GitHub puede demorar unos minutos los envíos programados.
name: Avisos diarios

on:
  schedule:
    # Laura (como siempre; GitHub suele llegar tarde, hasta una hora):
    - cron: "17 11 * * *"   # mañana: hacia las 6:17 a. m. de Colombia
    - cron: "47 0 * * *"    # noche: hacia las 7:47 p. m. de Colombia
    # Juan David (20-nov-2026): 9:00 a. m. y 6:00 p. m. en punto. Arrancan 45 min antes
    # y enviar.js espera hasta la hora exacta; si GitHub arranca tarde, sale apenas arranque.
    - cron: "15 13 * * *"   # mañana: 8:15 a. m. → espera a las 9:00 a. m.
    - cron: "15 22 * * *"   # noche: 5:15 p. m. → espera a las 6:00 p. m.
  push:
    branches: [main]
    paths: ["avisos/suscripciones.json"]   # celular recién registrado: aviso de bienvenida
  workflow_dispatch:
    inputs:
      tipo:
        description: "Tipo de aviso"
        required: true
        default: prueba
        type: choice
        options: [prueba, manana, noche, bienvenida]

permissions:
  contents: read

concurrency:
  group: avisos
  cancel-in-progress: false

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Instalar lo necesario
        run: npm ci --prefix avisos --no-audit --no-fund
      - name: Elegir el tipo de aviso
        id: tipo
        run: |
          q=todos; h=""
          if [ "${{ github.event_name }}" = "push" ]; then t=bienvenida
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then t="${{ inputs.tipo }}"
          else case "${{ github.event.schedule }}" in
            "17 11 * * *") t=manana; q=laura ;;
            "47 0 * * *")  t=noche;  q=laura ;;
            "15 13 * * *") t=manana; q=juandavid; h=09:00 ;;
            "15 22 * * *") t=noche;  q=juandavid; h=18:00 ;;
          esac; fi
          echo "tipo=$t" >> "$GITHUB_OUTPUT"
          echo "quien=$q" >> "$GITHUB_OUTPUT"
          echo "hora=$h" >> "$GITHUB_OUTPUT"
      - name: Enviar
        run: node avisos/enviar.js "${{ steps.tipo.outputs.tipo }}" "${{ steps.tipo.outputs.quien }}" "${{ steps.tipo.outputs.hora }}"
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
